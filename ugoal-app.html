<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UGOAL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap">
<style>
/* Layout: app de una columna (máx. 480px) pensada para el celular; fotos grandes que mandan, barra de 5 pestañas fija abajo. Estilo Estudio blanco · A Señal */
:root{
  --bg:#FFFFFF; --surface:#F4F4F2; --surface-2:#EAEAE6; --ink:#0B0B0C; --muted:#67676D; --line:#E6E6E2;
  --acc:#FF5A1F; --acc-soft:#FFEADF; --on-acc:#FFFFFF;
  --ok:#11845A; --ok-soft:#E2F4EB; --warn:#A65300; --warn-soft:#FFF0DC;
  --glass:rgba(255,255,255,.86); --scrim:rgba(10,10,12,.45); --shadow:0 18px 40px -24px rgba(0,0,0,.35);
  --f-d:"Archivo","Arial Black",system-ui,sans-serif; --f-b:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-xl:24px; --r-lg:18px; --r-md:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0B0D; --surface:#17171A; --surface-2:#222226; --ink:#F5F5F3; --muted:#A0A0A6; --line:#27272C;
    --acc:#FF6A33; --acc-soft:#3B1E13; --ok:#3DD598; --ok-soft:#12322A; --warn:#FFB04D; --warn-soft:#3A2B14;
    --glass:rgba(11,11,13,.84); --scrim:rgba(0,0,0,.6); --shadow:0 18px 40px -24px rgba(0,0,0,.9); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0B0D; --surface:#17171A; --surface-2:#222226; --ink:#F5F5F3; --muted:#A0A0A6; --line:#27272C;
  --acc:#FF6A33; --acc-soft:#3B1E13; --ok:#3DD598; --ok-soft:#12322A; --warn:#FFB04D; --warn-soft:#3A2B14;
  --glass:rgba(11,11,13,.84); --scrim:rgba(0,0,0,.6); --shadow:0 18px 40px -24px rgba(0,0,0,.9); color-scheme:dark;
}
/* Tema elegido dentro de la app (Perfil > Tema) */
:root[data-ug="light"]{
  --bg:#FFFFFF; --surface:#F4F4F2; --surface-2:#EAEAE6; --ink:#0B0B0C; --muted:#67676D; --line:#E6E6E2;
  --acc:#FF5A1F; --acc-soft:#FFEADF; --ok:#11845A; --ok-soft:#E2F4EB; --warn:#A65300; --warn-soft:#FFF0DC;
  --glass:rgba(255,255,255,.86); --scrim:rgba(10,10,12,.45); --shadow:0 18px 40px -24px rgba(0,0,0,.35); color-scheme:light;
}
:root[data-ug="dark"]{
  --bg:#0B0B0D; --surface:#17171A; --surface-2:#222226; --ink:#F5F5F3; --muted:#A0A0A6; --line:#27272C;
  --acc:#FF6A33; --acc-soft:#3B1E13; --ok:#3DD598; --ok-soft:#12322A; --warn:#FFB04D; --warn-soft:#3A2B14;
  --glass:rgba(11,11,13,.84); --scrim:rgba(0,0,0,.6); --shadow:0 18px 40px -24px rgba(0,0,0,.9); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:8px}
img{display:block}
.app{max-width:480px;margin:0 auto;padding-block:8px 120px}
.view{display:flex;flex-direction:column;gap:22px;animation:in .28s ease}
@keyframes in{from{transform:translateY(8px)}to{transform:none}}

/* tipografía */
.d{font-family:var(--f-d);font-weight:800;font-stretch:125%;letter-spacing:-.035em;line-height:.98;margin:0;text-wrap:balance}
.h1{font-size:36px}.h2{font-size:22px}.h3{font-size:18px}
.num{font-variant-numeric:tabular-nums}
.ey{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px} .xs{font-size:12px}
p{margin:0}

/* barra superior */
.top{display:flex;align-items:center;justify-content:space-between;padding-block:10px 0}
.wm{font-family:var(--f-d);font-weight:800;font-stretch:125%;font-size:20px;letter-spacing:.01em;display:inline-flex;align-items:center;background:none;border:0;padding:0}
.wm .o{display:inline-block;width:.76em;height:.76em;border-radius:50%;margin:0 .05em;box-shadow:inset 0 0 0 .11em var(--acc);background:radial-gradient(circle,var(--acc) 0 23%,transparent 24%)}
.av{width:36px;height:36px;border-radius:50%;background:var(--surface);border:0;display:grid;place-items:center;font-weight:700;font-size:13px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px}

/* resumen */
.hero-total{display:flex;flex-direction:column;gap:10px}
.hero-total .big{font-size:46px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;background:var(--surface);border:0}
.pill.acc{background:var(--acc);color:var(--on-acc)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill svg{width:14px;height:14px}

/* fotos */
.ph{position:relative;border-radius:var(--r-xl);overflow:hidden;background:var(--surface)}
.ph img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;left:12px;top:12px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:600;color:var(--ink)}
.tag.r{left:auto;right:12px}
.tag.done{background:var(--ok);color:#fff}

/* tarjetas de meta */
.goal-hero{display:flex;flex-direction:column;gap:12px;background:none;border:0;padding:0;text-align:left;width:100%}
.goal-hero .ph{aspect-ratio:4/3}
.row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.track{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.track i{display:block;height:100%;border-radius:9px;background:var(--acc);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.track.ok i{background:var(--ok)}
.track.thick{height:10px}
.list{display:flex;flex-direction:column;gap:2px}
.goal-row{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;background:none;border:0;padding:10px 0;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.goal-row:last-child{border-bottom:0}
.goal-row .ph{width:76px;height:76px;border-radius:16px}
.goal-row .info{display:flex;flex-direction:column;gap:6px;min-width:0}
.goal-row .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal-row .pct{font-family:var(--f-d);font-weight:800;font-stretch:125%;font-size:18px}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.link{background:none;border:0;padding:0;color:var(--acc);font-weight:600;font-size:13px}

/* botones */
.btn{border:0;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;padding:14px 18px;font-size:15px;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn .plus{color:var(--acc);font-size:18px;line-height:1}
.btn svg{width:18px;height:18px;flex:none}
.btn.acc{background:var(--acc);color:var(--on-acc)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.sm{width:auto;padding:9px 14px;font-size:13px}
.btns{display:flex;gap:10px}

/* bloques */
.card{background:var(--surface);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:12px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.calc-big{font-size:40px;color:var(--acc)}
.status{border-radius:var(--r-md);padding:11px 13px;font-size:14px}
.status.ok{background:var(--ok-soft);color:var(--ok)} .status.warn{background:var(--warn-soft);color:var(--warn)}
input[type=range]{width:100%;accent-color:var(--acc)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.kv b{font-variant-numeric:tabular-nums}

/* galería */
.gallery{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gallery .ph{flex:0 0 88%;aspect-ratio:4/3;scroll-snap-align:center}
.gallery.single .ph{flex-basis:100%}
.dots{display:flex;gap:5px;justify-content:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--surface-2)}
.dots i.on{background:var(--ink)}

/* historial */
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist li:last-child{border-bottom:0}
.hist .a{font-weight:700;color:var(--ok);font-variant-numeric:tabular-nums}

/* viaje */
.part{display:flex;flex-direction:column;gap:7px;padding:12px 0;border-bottom:1px solid var(--line)}
.part:last-child{border-bottom:0}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.checks li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.checks li:last-child{border-bottom:0}
.cb{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--muted);background:transparent;display:grid;place-items:center;flex:none;padding:0}
.cb.on{background:var(--acc);border-color:var(--acc);color:#fff}
.cb svg{width:14px;height:14px}
.checks .t{flex:1;min-width:0;font-size:14px}
.checks li.done .t{color:var(--muted);text-decoration:line-through}

/* física */
.weeks{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:none;width:44px;height:52px;border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--muted);border:0}
.wk b{font-family:var(--f-d);font-stretch:125%;font-size:16px;color:var(--ink)}
.wk.done{background:var(--ok-soft);color:var(--ok)} .wk.done b{color:var(--ok)}
.wk.now{background:var(--acc);color:#fff} .wk.now b{color:#fff}
.chart text{font-family:var(--f-b);font-size:10.5px;fill:var(--muted)}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ba .ph{aspect-ratio:3/4;border-radius:16px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12px;border:1.5px dashed var(--line);background:transparent}

/* explorar */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:0 14px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;padding:14px 0;width:100%;font-size:16px;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--bg)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mason{columns:2;column-gap:12px}
.it{break-inside:avoid;margin-bottom:16px;display:flex;flex-direction:column;gap:7px;background:none;border:0;padding:0;text-align:left;width:100%}
.it .ph{border-radius:18px}
.it .t1{font-size:13.5px;font-weight:700;line-height:1.2}
.it .t2{font-size:11.5px;color:var(--muted)}
.heart{position:absolute;right:9px;bottom:9px;width:32px;height:32px;border-radius:50%;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;border:0;padding:0;color:var(--ink)}
.heart svg{width:16px;height:16px}
.heart[aria-pressed="true"]{color:var(--acc)} .heart[aria-pressed="true"] svg{fill:var(--acc)}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .it{flex:0 0 140px;margin:0}
.hscroll .ph{aspect-ratio:1/1}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tg{border-radius:999px;background:var(--surface);padding:5px 10px;font-size:12px;font-weight:600;color:var(--muted)}

/* formulario */
.field{display:flex;flex-direction:column;gap:7px}
.field label,.flabel{font-weight:700;font-size:14px}
.input{width:100%;background:var(--surface);border:1.5px solid transparent;border-radius:var(--r-md);padding:13px 14px;font-size:16px}
.input:focus{border-color:var(--ink);outline:none}
textarea.input{resize:vertical;min-height:72px}
.types{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.types button{border:1.5px solid var(--line);background:var(--bg);border-radius:var(--r-md);padding:11px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:600}
.types button svg{width:20px;height:20px}
.types button[aria-pressed="true"]{border-color:var(--ink);background:var(--surface)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
.pickph{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.pickph button{flex:none;width:64px;height:64px;border-radius:14px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--surface)}
.pickph button[aria-pressed="true"]{border-color:var(--acc)}
.pickph img{width:100%;height:100%;object-fit:cover}
.upload{flex:none;width:64px;height:64px;border-radius:14px;border:1.5px dashed var(--muted);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--muted);text-align:center;cursor:pointer;position:relative;line-height:1.2}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--surface-2);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw:checked{background:var(--acc)} .sw:checked::after{transform:translateX(18px)}
.retos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.retos button{border:1.5px solid var(--line);background:var(--bg);border-radius:var(--r-md);padding:12px;text-align:left;display:flex;flex-direction:column;gap:3px}
.retos button[aria-pressed="true"]{border-color:var(--ink);background:var(--surface)}
.retos b{font-size:14px} .retos span{font-size:12px;color:var(--muted)}

/* grupos */
.member{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.member:last-child{border-bottom:0}
.mav{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:var(--f-d);font-stretch:125%;color:#fff}
.member .info{display:flex;flex-direction:column;gap:6px;min-width:0}
.member .l1{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.code{font-family:var(--f-d);font-weight:800;font-stretch:125%;font-size:32px;letter-spacing:.08em;text-align:center;background:var(--surface);border-radius:var(--r-md);padding:16px;user-select:all}

/* perfil y medallas */
.level{border-radius:var(--r-xl);padding:20px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--surface)}
.medal{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none;
  box-shadow:inset 0 2px 3px rgba(255,255,255,.55),inset 0 -3px 6px rgba(0,0,0,.25),0 8px 18px -10px rgba(0,0,0,.5)}
.medal::after{content:"";position:absolute;inset:7px;border-radius:50%;border:1.5px solid rgba(255,255,255,.45)}
.medal svg{width:46%;height:46%;color:rgba(0,0,0,.55);position:relative;z-index:1}
.medal.bronze{background:linear-gradient(135deg,#E2A475 0%,#B26B3C 45%,#7D4222 100%)}
.medal.silver{background:linear-gradient(135deg,#F4F5F7 0%,#B9BEC6 45%,#7E848D 100%)}
.medal.gold{background:linear-gradient(135deg,#FFE79A 0%,#E2B23A 45%,#9C7317 100%)}
.medal.platinum{background:linear-gradient(135deg,#F2FBFF 0%,#BCD3DE 45%,#6E8896 100%)}
.medal.diamond{background:linear-gradient(135deg,#F0F4FF 0%,#A9C2FF 40%,#5B6FD8 100%)}
.medal.locked{background:var(--surface-2);box-shadow:none}
.medal.locked::after{border-color:var(--line)}
.medal.locked svg{color:var(--muted)}
.medals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 10px}
.mtile{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;background:none;border:0;padding:0}
.mtile .medal{width:64px;height:64px}
.mtile b{font-size:12.5px;line-height:1.2} .mtile small{font-size:11px;color:var(--muted);line-height:1.2}
.reto{display:flex;flex-direction:column;gap:8px;padding:13px 0;border-bottom:1px solid var(--line)}
.reto:last-child{border-bottom:0}
.reto .r1{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.rw{font-size:12px;font-weight:700;color:var(--acc);white-space:nowrap}
.credits{font-size:12px;color:var(--muted)}
.credits ul{padding-left:16px;margin:8px 0 0;display:flex;flex-direction:column;gap:4px}

/* pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);padding:3px 0}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink)} .tab[aria-current="page"] svg{color:var(--acc)}
.fab{width:50px;height:50px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;margin:0 auto;border:0;box-shadow:0 10px 22px -10px var(--acc)}
.fab svg{width:24px;height:24px}

/* hojas, avisos, celebración */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:28px 28px 0 0;max-height:92vh;overflow-y:auto;
  padding:10px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:16px;animation:up .26s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:9px;background:var(--surface-2);margin:0 auto 4px}
@keyframes up{from{transform:translateY(60px);opacity:.5}to{transform:none;opacity:1}}
.qchips{display:flex;flex-wrap:wrap;gap:8px}

function calc(g, period, paid, tgt){
  const t = today(), end = P(g.due), start = P(g.start);

  const expected = tgt*frac;
  return {daysLeft, periods, remaining, per: remaining/periods, diff: paid - expected};

const img = (k, alt='') => k && k.startsWith('data:') ? `<img src="${k}" alt="${esc(alt)}">` : `<img src="${F(k)}" alt="${esc(alt)}">`;
const seg = (cur, act) => `<div class="seg" role="group" aria-label="Periodo">${[[7,'Semana'],[15,'Quincena'],[30,'Mes']].map(([v,l])=>`<button type="button" data-act="${act}" data-v="${v}" aria-pressed="${cur===v}">${l}</button>`).join('')}</div>`;
const topbar = () => `<div class="top"><button class="wm" data-go="inicio" aria-label="UGOAL, inicio">UG<span class="o" aria-hidden="true"></span>AL</button><button class="av" data-go="perfil" aria-label="Perfil">${esc((S.name||'U')[0].toUpperCase())}</button></div>`;
const backbar = (to, right='') => `<div class="bar"><button class="iconbtn" data-back="${to}" aria-label="Regresar">${I.back}</button>${right}</div>`;
function goalSub(g){
  if (isMoney(g)) { const c = gcalc(g); return g.done ? '¡Cumplida!' : `${money(c.per)} ${plabel(S.period).replace('por ','/ ')}`; }
  if (g.type==='fisica') return `Semana ${weekOf(g)} de ${g.plan.length} · ${nf(curMetric(g))} ${g.unit}`;
  return `${g.count||0} de ${g.total} sesiones`;
}

/* ================= pantallas ================= */
function vInicio(){
  const main = S.goals.find(g=>g.id===S.main && !g.done) || S.goals.find(g=>!g.done && isMoney(g)) || S.goals[0];
  const c = main && isMoney(main) ? gcalc(main) : null;
  const d = today().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
  const rest = S.goals.filter(g=>g!==main);
  return `${topbar()}
  <section class="hero-total">
    <span class="ey">${d}${S.name?` · Hola, ${esc(S.name)}`:''}</span>
    <p class="d big num">${money(totalSaved())}</p>
    <span class="muted small">ahorrado para tus sueños</span>
    <div class="pills"><span class="pill acc">${money(dueNow())} ${pthis(S.period)}</span><span class="pill">${I.fire} ${S.streak} semanas de racha</span></div>
  </section>
  ${main ? `<button class="goal-hero" data-go="meta-${main.id}">
    <div class="ph">${img(main.photos[0], main.name)}<span class="tag">${esc(main.cat)} · ${fmonth(main.due)}</span>${main.done?'<span class="tag r done">Cumplida</span>':''}</div>
    <div class="row"><h2 class="d h2">${esc(main.name)}</h2><span class="d h2 num" style="color:var(--acc)">${Math.round(pct(main))}%</span></div>
    ${track(pct(main))}
    <div class="row muted small num"><span>${money(gSaved(main))} de ${money(gPrice(main))}</span>${c?`<span>${money(c.per)} ${plabel(S.period)}</span>`:''}</div>
  </button>
  <button class="btn" data-act="aporte" data-id="${main.id}"><span class="plus">+</span> Aparté</button>` : ''}
  <section class="stack" style="display:flex;flex-direction:column;gap:6px">
    <div class="sec"><h2 class="d h3">Mis sueños</h2><span class="muted xs">${S.goals.length} metas</span></div>
    <div class="list">${rest.map(g=>`<button class="goal-row" data-go="meta-${g.id}"><div class="ph">${img(g.photos[0], g.name)}</div>
      <div class="info"><span class="nm">${esc(g.name)}</span>${track(pct(g), g.done?'ok':'')}<span class="muted xs num">${goalSub(g)}</span></div>
      <span class="pct num">${Math.round(pct(g))}%</span></button>`).join('')}
      ${S.groups.map(gr=>`<button class="goal-row" data-go="grupo-${gr.id}"><div class="ph">${img(gr.photo, gr.name)}</div>
      <div class="info"><span class="nm">${esc(gr.name)}</span>${track(gr.members[0].paid/cuota(gr)*100)}<span class="muted xs num">En grupo · tu parte ${money(cuota(gr))}</span></div>
      <span class="pct num">${Math.round(gr.members[0].paid/cuota(gr)*100)}%</span></button>`).join('')}</div>
  </section>
  <section style="display:flex;flex-direction:column;gap:12px">
    <div class="sec"><h2 class="d h3">Ideas para ti</h2><button class="link" data-go="explorar">Explorar todo</button></div>
    <div class="hscroll">${[...new Set(IDEAS.filter(i=>S.saved.includes(i.id)).concat(IDEAS.slice(4,8)))].slice(0,6).map(ideaCard).join('')}</div>
  </section>
  <p class="proto">Prototipo con datos de ejemplo. Lo que registres se guarda solo en este navegador.</p>`;
}

function ideaCard(i){
  return `<button class="it" data-go="idea-${i.id}"><div class="ph" style="aspect-ratio:${i.r}">${img(i.img, i.n)}<span class="heart" role="button" data-act="heart" data-v="${i.id}" aria-pressed="${S.saved.includes(i.id)}" aria-label="Guardar ${esc(i.n)}">${I.heart}</span></div>
    <span class="t1">${esc(i.n)}</span><span class="t2">${esc(i.b)} · ${i.c}</span></button>`;
}
let feedCat = 'Todo', feedQ = '';
function feedItems(){
  const q = feedQ.trim().toLowerCase();
  return IDEAS.filter(i => (feedCat==='Todo' || i.c===feedCat || (feedCat==='Guardados' && S.saved.includes(i.id))) &&
    (!q || (i.n+' '+i.b+' '+i.c+' '+i.t.join(' ')).toLowerCase().includes(q)));
}
function vExplorar(){
  const cats = CATS.concat(S.saved.length?['Guardados']:[]);
  return `<div class="bar"><h1 class="d h1">Explorar</h1><span class="muted xs num">${IDEAS.length} ideas</span></div>
  <label class="search">${I.search}<input id="q" type="search" placeholder="Busca un sueño: moto, Japón, Jordan…" value="${esc(feedQ)}" aria-label="Buscar ideas" autocomplete="off"></label>
  <div class="chips" role="group" aria-label="Categorías">${cats.map(c=>`<button class="chip" data-act="cat" data-v="${c}" aria-pressed="${feedCat===c}">${c}</button>`).join('')}</div>
  <div id="feed">${feedHtml()}</div>`;
}
const feedHtml = () => { const it = feedItems(); return it.length ? `<div class="mason">${it.map(ideaCard).join('')}</div>` : `<p class="empty">No encontramos ideas con esa búsqueda. Prueba con otra palabra o <button class="link" data-go="nueva">crea tu propia meta</button>.</p>`; };

function vIdea(i){
  if (!i) return vExplorar();
  const sim = IDEAS.filter(x=>x.c===i.c && x.id!==i.id).slice(0,8);
  return `${backbar('explorar', `<button class="iconbtn" data-act="heart" data-v="${i.id}" aria-pressed="${S.saved.includes(i.id)}" aria-label="Guardar" style="color:${S.saved.includes(i.id)?'var(--acc)':'inherit'}">${I.heart.replace('fill="none"', S.saved.includes(i.id)?'fill="currentColor"':'fill="none"')}</button>`)}
  <div class="ph" style="aspect-ratio:4/4.4">${img(i.img, i.n)}<span class="tag">${i.c}</span></div>
  <section style="display:flex;flex-direction:column;gap:10px"><span class="ey">${esc(i.b)}</span><h1 class="d h1">${esc(i.n)}</h1>
    <div class="tags">${i.t.map(t=>`<span class="tg">${esc(t)}</span>`).join('')}</div></section>
  <div class="card"><b>${i.type==='fisica'?`Reto con plan de ${RETOS[i.reto].w} semanas`:'Tú decides el precio'}</b>
    <p class="muted small">${i.type==='fisica'?'Incluye entrenamientos semana a semana, registro de tu avance y fotos de antes y después.':'UGOAL no te dice cuánto cuesta. Pones el precio que encontraste y la calculadora te dice cuánto apartar por quincena.'}</p></div>
  <button class="btn acc" data-act="fromidea" data-v="${i.id}">Hacerla mi meta</button>
  ${sim.length?`<section style="display:flex;flex-direction:column;gap:12px"><h2 class="d h3">Ideas parecidas</h2><div class="hscroll">${sim.map(ideaCard).join('')}</div></section>`:''}`;
}

function vMeta(g){
  if (!g) return vInicio();
  const gal = `<div class="gallery ${g.photos.length===1?'single':''}" id="gal">${g.photos.map((p,k)=>`<div class="ph">${img(p, g.name)}${k===0?`<span class="tag">${esc(g.cat)}</span>`:''}</div>`).join('')}</div>
    ${g.photos.length>1?`<div class="dots" id="dots">${g.photos.map((_,k)=>`<i class="${k?'':'on'}"></i>`).join('')}</div>`:''}`;
  const head = `${backbar('inicio', `<button class="iconbtn" data-act="share" data-id="${g.id}" aria-label="Compartir">${I.share}</button>`)}${gal}
    <section style="display:flex;flex-direction:column;gap:8px"><h1 class="d h1">${esc(g.name)}</h1>${g.why?`<p class="muted">“${esc(g.why)}”</p>`:''}</section>`;
  if (g.type==='fisica') return head + vFisica(g);
  if (!isMoney(g)) return head + vSesiones(g);
  const c = gcalc(g), p = pct(g);
  let status;
  if (g.done) status = `<div class="status ok">¡Meta cumplida! Ganaste 200 puntos y una medalla.</div>`;
  else if (c.diff >= 0) status = `<div class="status ok">Vas ${money(c.diff)} arriba del ritmo. Sigue así.</div>`;
  else status = `<div class="status warn">Vas ${money(-c.diff)} abajo del ritmo. Aparta <b>${money(c.per - c.diff)}</b> ${pthis(S.period)} para ponerte al día.</div>`;
  const months = Math.max(1, Math.round((P(g.due)-today())/DAY/30.4));
  return head + `
  <section class="card">
    <div class="row"><div style="display:flex;flex-direction:column;gap:4px"><span class="ey">Llevas</span><span class="d h2 num">${money(gSaved(g))}</span></div>
      <div style="text-align:right;display:flex;flex-direction:column;gap:4px"><span class="ey">Precio que pusiste</span><span class="num" style="font-weight:700">${money(gPrice(g))}</span></div></div>
    ${track(p,'thick '+(g.done?'ok':''))}
    <div class="row muted small num"><span>${Math.round(p)}% · faltan ${money(gPrice(g)-gSaved(g))}</span><span>Meta: ${fdate(g.due)}</span></div>
    ${g.done?'':`<button class="btn" data-act="aporte" data-id="${g.id}"><span class="plus">+</span> Aparté</button>`}
  </section>
  ${g.done?status:`<section class="card">
    <div class="row" style="align-items:center;flex-wrap:wrap"><h2 class="d h3">Calculadora</h2>${seg(S.period,'period')}</div>
    <p class="d calc-big num">${money(c.per)}</p><p class="muted small">${plabel(S.period)} durante ${c.periods} ${S.period===7?'semanas':S.period===15?'quincenas':'meses'} para llegar el ${fdate(g.due)}.</p>
    ${status}
    <div class="field" style="gap:6px;margin-top:4px"><label for="sim">Simulador: ¿y si lo quiero en otra fecha?</label>
      <input type="range" id="sim" min="1" max="60" value="${months}" data-id="${g.id}">
      <p class="small num" id="simout">${simText(g, months)}</p></div>
  </section>`}
  ${g.type==='viaje'?vViaje(g):''}
  <section style="display:flex;flex-direction:column;gap:6px"><h2 class="d h3">Historial</h2>
    <ul class="hist">${g.hist.length?g.hist.map(h=>`<li><span><b>${fshort(h.d)}</b> <span class="muted">${esc(h.n||'Aporte')}</span></span><span class="a">+${money(h.a)}</span></li>`).join(''):'<li class="muted">Aún no hay aportes. El primero te da 10 puntos.</li>'}</ul></section>`;
}
function simText(g, months){
  const d = new Date(today()); d.setMonth(d.getMonth()+ +months);
  const c = calc({start:g.start, due:iso(d)}, S.period, gSaved(g), gPrice(g));
  return `Para ${d.toLocaleDateString('es-MX',{month:'long',year:'numeric'})}: <b>${money(c.per)}</b> ${plabel(S.period)}.`;
}
function vViaje(g){
  return `<section style="display:flex;flex-direction:column;gap:4px"><div class="sec"><h2 class="d h3">Desglose del viaje</h2><span class="muted xs">Tú pones cada monto</span></div>
    ${g.parts.map(p=>`<div class="part"><div class="kv"><span>${esc(p.n)}</span><b>${money(p.s)} / ${money(p.p)}</b></div>${track(p.s/p.p*100, p.s>=p.p?'ok':'')}</div>`).join('')}</section>
  <section style="display:flex;flex-direction:column;gap:4px"><div class="sec"><h2 class="d h3">Lista del viaje</h2><span class="muted xs num">${g.checks.filter(c=>c.done).length} de ${g.checks.length}</span></div>
    <ul class="checks">${g.checks.map((c,k)=>`<li class="${c.done?'done':''}"><button class="cb ${c.done?'on':''}" data-act="check" data-id="${g.id}" data-v="${k}" aria-pressed="${c.done}" aria-label="${esc(c.t)}">${c.done?I.check:''}</button>
      <span class="t">${esc(c.t)}</span><span class="muted xs num">${fshort(c.d)}</span></li>`).join('')}</ul></section>`;
}
function vFisica(g){
  const w = weekOf(g), wk = g.plan[w-1], p = pct(g);
  const doneW = g.plan.filter(x=>x.every(y=>y.done)).length;
  return `<section class="card">
    <div class="row"><div style="display:flex;flex-direction:column;gap:4px"><span class="ey">Tu mejor marca</span><span class="d h2 num">${nf(curMetric(g))} ${g.unit}</span></div>
      <div style="text-align:right;display:flex;flex-direction:column;gap:4px"><span class="ey">Meta</span><span class="num" style="font-weight:700">${nf(g.target)} ${g.unit} · ${fshort(g.due)}</span></div></div>
    ${track(p,'thick')}
    <button class="btn" data-act="metric" data-id="${g.id}"><span class="plus">+</span> Registrar marca</button>
  </section>
  <section style="display:flex;flex-direction:column;gap:10px">
    <div class="sec"><h2 class="d h3">Semana ${w} de ${g.plan.length}</h2><span class="muted xs num">${doneW} semanas completas</span></div>
    <div class="weeks">${g.plan.map((x,k)=>`<span class="wk ${k+1===w?'now':x.every(y=>y.done)?'done':''}"><b>${k+1}</b>sem</span>`).join('')}</div>
    <ul class="checks">${wk.map((x,k)=>`<li class="${x.done?'done':''}"><button class="cb ${x.done?'on':''}" data-act="workout" data-id="${g.id}" data-v="${k}" aria-pressed="${x.done}" aria-label="${esc(x.t)}">${x.done?I.check:''}</button><span class="t">${esc(x.t)}</span><span class="muted xs">+10 pts</span></li>`).join('')}</ul>
  </section>
  <section style="display:flex;flex-direction:column;gap:10px"><h2 class="d h3">Tu avance contra el plan</h2>${chart(g)}</section>
  <section style="display:flex;flex-direction:column;gap:10px"><div class="sec"><h2 class="d h3">Antes y después</h2><span class="muted xs">Solo tú las ves</span></div>
    <div class="ba">${['Foto de la semana 1','Foto de hoy'].map((t,k)=>`<label class="ph" style="position:relative">${g.ba && g.ba[k] ? `<img src="${g.ba[k]}" alt="${t}" style="position:absolute;inset:0">` : `${t}<br>Toca para subir`}<input type="file" accept="image/*" data-ba="${k}" data-id="${g.id}" style="position:absolute;inset:0;opacity:0;cursor:pointer" aria-label="${t}"></label>`).join('')}</div></section>`;
}
function chart(g){
  const W = 340, H = 180, l = 34, r = 12, t = 12, b = 26, n = g.plan.length;
  const x = w => l + (w-1)/(n-1)*(W-l-r), y = v => t + (1-(v-0)/(g.target*1.1))*(H-t-b);
  const ticks = [0, g.target/2, g.target];
  const planPts = Array.from({length:n},(_,k)=>`${x(k+1)},${y(g.base+(g.target-g.base)*k/(n-1))}`).join(' ');
  const real = g.metrics.map(m=>`${x(m.w)},${y(m.v)}`).join(' ');
  const last = g.metrics.at(-1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Distancia por semana contra el plan">
    ${ticks.map(v=>`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${l-6}" y="${y(v)+3.5}" text-anchor="end">${nf(v)}</text>`).join('')}
    ${[1,Math.ceil(n/2),n].map(w=>`<text x="${x(w)}" y="${H-8}" text-anchor="middle">Sem ${w}</text>`).join('')}
    <polyline points="${planPts}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <polyline points="${real}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${last?`<circle cx="${x(last.w)}" cy="${y(last.v)}" r="5" fill="var(--acc)" stroke="var(--bg)" stroke-width="2"/><text x="${x(last.w)}" y="${y(last.v)-10}" text-anchor="middle" style="fill:var(--ink);font-weight:700">${nf(last.v)} ${g.unit}</text>`:''}
  </svg><div class="pills"><span class="pill"><span style="width:14px;height:3px;background:var(--acc);border-radius:2px;display:inline-block"></span>Tu marca</span><span class="pill"><span style="width:14px;border-top:2px dashed var(--muted);display:inline-block"></span>Plan</span></div>`;
}
function vSesiones(g){
  return `<section class="card"><div class="row"><div style="display:flex;flex-direction:column;gap:4px"><span class="ey">Sesiones</span><span class="d h2 num">${g.count||0} de ${g.total}</span></div><span class="muted small">Meta: ${fdate(g.due)}</span></div>
    ${track(pct(g),'thick')}<button class="btn" data-act="sesion" data-id="${g.id}"><span class="plus">+</span> Hoy cumplí</button></section>`;
}

function vGrupos(){
  return `<div class="bar"><h1 class="d h1">Grupos</h1></div>
  <p class="muted">La meta se divide en partes iguales y cada quien ve cuánto le toca apartar.</p>
  ${S.groups.map(gr=>`<button class="goal-hero" data-go="grupo-${gr.id}"><div class="ph" style="aspect-ratio:16/10">${img(gr.photo, gr.name)}<span class="tag">${gr.members.length} personas · ${money(cuota(gr))} c/u</span></div>
    <div class="row"><h2 class="d h2">${esc(gr.name)}</h2><span class="d h2 num" style="color:var(--acc)">${Math.round(gr.members.reduce((s,m)=>s+m.paid,0)/gr.price*100)}%</span></div>
    ${track(gr.members.reduce((s,m)=>s+m.paid,0)/gr.price*100)}</button>`).join('') || '<p class="empty">Aún no tienes metas en grupo.</p>'}
  <button class="btn acc" data-act="newgroup">Crear meta en grupo</button>
  <section class="card"><h2 class="d h3">¿Te invitaron?</h2><p class="muted small">Escribe el código que te compartieron.</p>
    <form class="two" data-form="join"><input class="input" id="joincode" placeholder="UGO-XXXX" autocomplete="off" aria-label="Código de invitación"><button class="btn" type="submit">Unirme</button></form></section>`;
}
function vGrupo(gr){
  if (!gr) return vGrupos();
  const tot = gr.members.reduce((s,m)=>s+m.paid,0), q = cuota(gr), me = gr.members[0], mc = grCalc(gr, me);
  return `${backbar('grupos', `<button class="btn sm ghost" data-act="invite" data-id="${gr.id}">Invitar</button>`)}
  <div class="ph" style="aspect-ratio:16/11">${img(gr.photo, gr.name)}<span class="tag">En grupo · ${fmonth(gr.due)}</span></div>
  <h1 class="d h1">${esc(gr.name)}</h1>
  <section class="card"><span class="ey">Cuota fija</span>
    <p>${money(gr.price)} entre ${gr.members.length} = <b>${money(q)} por persona</b>.</p>
    ${track(tot/gr.price*100,'thick')}<div class="row muted small num"><span>Entre todos: ${money(tot)}</span><span>${Math.round(tot/gr.price*100)}%</span></div>
    <div class="status ${mc.diff>=0?'ok':'warn'}">Te toca <b>${money(mc.per)}</b> ${plabel(S.period)}${mc.diff<0?`. Vas ${money(-mc.diff)} abajo.`:'. Vas al día.'}</div>
    <button class="btn" data-act="graporte" data-id="${gr.id}"><span class="plus">+</span> Aparté mi parte</button></section>
  <section style="display:flex;flex-direction:column;gap:2px"><div class="sec" style="flex-wrap:wrap;align-items:center"><h2 class="d h3">Integrantes</h2>${seg(S.period,'period')}</div>
    ${gr.members.map((m,i)=>{ const c = grCalc(gr, m), ok = c.diff >= -q*0.01, pc = Math.round(m.paid/q*100);
      return `<div class="member"><span class="mav" style="background:${AVC[i%AVC.length]}">${esc(m.n[0])}</span>
        <div class="info"><div class="l1"><b>${esc(m.n)}</b><span class="muted num">${m.show==='monto'?`${money(m.paid)} / ${money(q)}`:`${pc}% de su parte`}</span></div>${track(pc)}</div>
        <span class="pill ${ok?'ok':'warn'}">${ok?'Al día':'Atrasado'}</span></div>`; }).join('')}</section>
  <section class="card"><div class="toggle" style="padding:0;border:0"><span><b>Mostrar mi monto exacto</b><br><span class="muted small">Si lo apagas, el grupo solo ve tu porcentaje.</span></span>
    <input type="checkbox" class="sw" data-act="privacy" data-id="${gr.id}" ${me.show==='monto'?'checked':''} aria-label="Mostrar mi monto exacto"></div></section>`;
}

let draft = null;
function newDraft(from){
  const i = from ? IDEAS.find(x=>x.id===from) : null;
  draft = {type: i ? i.type : 'cosa', name: i ? (i.type==='viaje' ? `Viaje a ${i.n.split(',')[0].split(' ·')[0]}` : i.n) : '', photo: i ? i.img : '', price:'', saved:'',
    due: off(365), why:'', group:false, people:4, reto: i && i.reto ? i.reto : '10k', total:36, from: i ? i.id : null};
}
function vNueva(){
  if (!draft) newDraft();
  const d = draft, m = MONEY.includes(d.type);
  const photos = [...new Set([d.photo, ...IDEAS.filter(x=>x.type===d.type || (m && MONEY.includes(x.type))).map(x=>x.img)])].filter(Boolean).slice(0,10);
  return `${backbar('inicio')}
  <section style="display:flex;flex-direction:column;gap:8px"><span class="ey">${d.from?'Desde una idea':'Nueva meta'}</span><h1 class="d h1">¿Qué quieres lograr?</h1></section>
  <form data-form="nueva" style="display:flex;flex-direction:column;gap:18px">

  if (!price) return `<span class="ey">Calculadora</span><p class="muted small">Escribe el precio y la fecha para ver cuánto te toca apartar.</p>`;

}

let tT;
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.hidden = false; clearTimeout(tT); tT = setTimeout(()=>t.hidden=true, 2800); }
const cv = document.getElementById('confetti'), cx = cv.getContext('2d'); let parts = [], raf = 0;
function confetti(n=60){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  cv.width = innerWidth*devicePixelRatio; cv.height = innerHeight*devicePixelRatio;
  const cols = ['#FF5A1F','#FFC53D','#11845A','#2343F2','#FFFFFF','#0B0B0C'];
  for (let i=0;i<n;i++) parts.push({x:innerWidth/2+(Math.random()-.5)*160, y:innerHeight*.42, vx:(Math.random()-.5)*13, vy:-Math.random()*15-4, r:Math.random()*7+4, c:cols[i%6], a:Math.random()*6, life:0});
  if (!raf) tick();
}
function tick(){
  cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); cx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{ p.vy+=.42; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=.18; p.life++; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.a); cx.fillStyle=p.c; cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); cx.restore(); });
  parts = parts.filter(p=>p.y<innerHeight+30 && p.life<220);
  raf = parts.length ? requestAnimationFrame(tick) : (cx.clearRect(0,0,innerWidth,innerHeight), 0);
}
function addPoints(n){
  const b = level(S.points); S.points += n; const a = level(S.points);
  if (a > b) setTimeout(()=>{ toast(`Subiste a ${LEVELS[a][1]}`); confetti(120); }, 1500);
}

function applyAporte(kind, id, amt, note, partIdx){
  let g;
  if (kind==='grupo'){ const gr = S.groups.find(x=>x.id===id); gr.members[0].paid += amt; }
  else {
    g = S.goals.find(x=>x.id===id);
    if (g.type==='viaje'){ const p = g.parts[partIdx||0]; p.s = Math.min(p.p, p.s+amt); } else g.saved += amt;
    g.hist.unshift({d:iso(today()), a:amt, n:note || (g.type==='viaje' ? g.parts[partIdx||0].n : 'Aporte')});
  }
  const per = kind==='grupo' ? 0 : gcalc(g).per;
  let pts = 10, msg = '+10 pts por tu aporte';
  if (kind==='meta' && amt >= per*0.98){ pts += 15; msg = `+25 pts: cumpliste lo de ${pthis(S.period)}`; }
  const c1 = S.week.c.find(c=>c.id==='r1'); if (c1.p < c1.of) c1.p++;
  addPoints(pts);
  if (g && !g.done && gSaved(g) >= gPrice(g)){ g.done = true; addPoints(200); save(); render(true); celebrate(g); return; }
  save(); render(true); confetti(40); toast(msg);
}
document.addEventListener('click', e=>{
  const back = e.target.closest('[data-back]');
  if (back){ go(back.dataset.back); return; }
  const a = e.target.closest('[data-act]');
  if (a){
    const act = a.dataset.act, v = a.dataset.v, id = a.dataset.id;
    if (act==='heart'){ e.preventDefault(); e.stopPropagation(); const k = S.saved.indexOf(v); if (k>=0) S.saved.splice(k,1); else { S.saved.push(v); toast('Guardado en tu lista de deseos'); } save(); render(true); return; }
    if (act==='aporte') aporteSheet(S.goals.find(g=>g.id===id));
    else if (act==='graporte') aporteSheet(null, S.groups.find(g=>g.id===id));
    else if (act==='close') closeSheet();
    else if (act==='closecel'){ cel.hidden = true; }
    else if (act==='chip'){ const i = document.getElementById('a-amt'); i.value = v; i.focus(); }
    else if (act==='period'){ S.period = +v; save(); if (route()==='nueva') document.getElementById('preview').innerHTML = preview(); else render(true); }
    else if (act==='cat'){ feedCat = v; render(true); }
    else if (act==='fromidea'){ newDraft(v); go('nueva'); }
    else if (act==='dtype'){ draft.type = v; if (v==='fisica' && !draft.reto) draft.reto='10k'; render(true); }
    else if (act==='dreto'){ draft.reto = v; render(true); }
    else if (act==='dphoto'){ draft.photo = v; render(true); }
    else if (act==='newgroup'){ newDraft(); draft.type='cosa'; draft.group=true; go('nueva'); }
    else if (act==='check'){ const g = S.goals.find(x=>x.id===id), c = g.checks[+v]; c.done = !c.done; if (c.done){ addPoints(10); const r3 = S.week.c.find(x=>x.id==='r3'); if (r3.p<r3.of) r3.p++; toast('+10 pts · pendiente listo'); } save(); render(true); }
    else if (act==='workout'){ const g = S.goals.find(x=>x.id===id), w = g.plan[weekOf(g)-1][+v]; w.done = !w.done;
      if (w.done){ addPoints(10); const r2 = S.week.c.find(x=>x.id==='r2'); if (r2.p<r2.of) r2.p++; let m = '+10 pts · entrenamiento hecho'; if (g.plan[weekOf(g)-1].every(x=>x.done)){ addPoints(15); m = '+25 pts · ¡semana completa!'; confetti(50); } toast(m); }
      save(); render(true); }
    else if (act==='metric'){ const g = S.goals.find(x=>x.id===id);
      openSheet(`<h2 class="d h2">Nueva marca</h2><p class="muted small">${esc(g.name)} · tu mejor marca: ${nf(curMetric(g))} ${g.unit}</p>
      <form data-form="metric" data-id="${g.id}" style="display:flex;flex-direction:column;gap:14px"><div class="field"><label for="m-v">¿Cuántos ${g.unit} lograste?</label><input class="input num" id="m-v" type="number" step="0.1" min="0" required></div>
      <button class="btn acc" type="submit">Guardar · +10 pts</button><button class="btn ghost" type="button" data-act="close">Cancelar</button></form>`); }
    else if (act==='sesion'){ const g = S.goals.find(x=>x.id===id); g.count = Math.min(g.total,(g.count||0)+1); addPoints(10); if (g.count>=g.total && !g.done){ g.done = true; addPoints(200); save(); render(true); celebrate(g); return; } save(); render(true); toast('+10 pts · sesión cumplida'); }
    else if (act==='share'){ cel.hidden = true; shareSheet(S.goals.find(g=>g.id===id)); }
    else if (act==='invite'){ const gr = S.groups.find(x=>x.id===id);
      openSheet(`<h2 class="d h2">Invita a tu grupo</h2><p class="muted small">Quien se una verá su cuota de ${money(cuota(gr))} y cuánto le toca ${plabel(S.period)}.</p>
      <div class="code" id="code">${gr.code}</div><button class="btn" data-act="copy">Copiar código</button><button class="btn ghost" data-act="close">Listo</button>`); }
    else if (act==='copy'){ const code = document.getElementById('code').textContent;
      navigator.clipboard.writeText(code).then(()=>toast('Código copiado')).catch(()=>{ const r = document.createRange(); r.selectNodeContents(document.getElementById('code')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selecciona el código y cópialo'); }); }
    else if (act==='privacy'){ const gr = S.groups.find(x=>x.id===id); gr.members[0].show = a.checked ? 'monto' : 'pct'; save(); render(true); toast(a.checked?'El grupo verá tu monto':'El grupo solo verá tu porcentaje'); }
    else if (act==='claim'){ const c = S.week.c.find(x=>x.id===v); if (c && !S.week.claimed.includes(v)){ S.week.claimed.push(v); addPoints(c.r); save(); render(true); confetti(70); toast(`+${c.r} pts · reto completado`); } }
    else if (act==='mode'){ S.settings.mode = v; save(); applyMode(); render(true); }
    else if (act==='priv'){ S.settings.privacy = v; save(); render(true); }
    else if (act==='notif'){ S.settings.notif[v] = a.checked; save(); toast(a.checked?'Recordatorio activado':'Recordatorio desactivado'); }
    else if (act==='reset'){ if (!resetArmed){ resetArmed = true; render(true); return; } resetArmed = false; S = seed(); draft = null; save(); applyMode(); go('inicio'); toast('Volviste a los datos de ejemplo'); }
    return;
  }
  const g = e.target.closest('[data-go]');
  if (g){ e.preventDefault(); if (g.dataset.go==='nueva' && !g.closest('form')) { if (!draft || !draft.keep) newDraft(); } resetArmed = false; go(g.dataset.go); }
});

  if (route()==='nueva' && el.dataset.k){
    draft.keep = true;
    if (el.type==='checkbox'){ draft[el.dataset.k] = el.checked; render(true); return; }
    draft[el.dataset.k] = el.value; document.getElementById('preview').innerHTML = preview();
  }
});
function shrink(file, cb){ const fr = new FileReader(); fr.onload = () => { const im = new Image(); im.onload = () => { const s = Math.min(1, 900/Math.max(im.width,im.height)); const c = document.createElement('canvas'); c.width = im.width*s; c.height = im.height*s; c.getContext('2d').drawImage(im,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',.8)); }; im.onerror = () => toast('No pudimos abrir esa imagen. Prueba con otra.'); im.src = fr.result; }; fr.readAsDataURL(file); }
document.addEventListener('change', e=>{
  if (e.target.dataset.ba && e.target.files[0]){ const g = S.goals.find(x=>x.id===e.target.dataset.id), k = +e.target.dataset.ba; shrink(e.target.files[0], url=>{ g.ba = g.ba || []; g.ba[k] = url; save(); render(true); toast('Foto guardada, solo tú la ves'); }); return; }
  if (e.target.id==='f-photo' && e.target.files[0]){
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => { const s = Math.min(1, 900/Math.max(im.width,im.height)); const c = document.createElement('canvas'); c.width = im.width*s; c.height = im.height*s; c.getContext('2d').drawImage(im,0,0,c.width,c.height); draft.photo = c.toDataURL('image/jpeg',.82); draft.keep = true; render(true); }; im.onerror = () => toast('No pudimos abrir esa imagen. Prueba con otra.'); im.src = fr.result; };
    fr.readAsDataURL(e.target.files[0]);
  }
});
document.addEventListener('submit', e=>{
  e.preventDefault(); const f = e.target;
  if (f.dataset.form==='aporte'){
    const amt = parseFloat(document.getElementById('a-amt').value);
    if (!(amt>0)){ toast('Escribe una cantidad mayor a cero'); return; }
    const part = document.getElementById('a-part'); closeSheet();
    applyAporte(f.dataset.kind, f.dataset.id, amt, document.getElementById('a-note').value.trim(), part ? +part.value : 0);
  } else if (f.dataset.form==='metric'){
    const g = S.goals.find(x=>x.id===f.dataset.id), v = parseFloat(document.getElementById('m-v').value);
    if (!(v>=0)){ toast('Escribe tu marca'); return; }
    const w = weekOf(g), last = g.metrics.at(-1);
    if (last && last.w===w) last.v = Math.max(last.v, v); else g.metrics.push({w, v});
    closeSheet(); addPoints(10); save(); render(true); toast(v>=g.target?'¡Llegaste a tu meta!':'+10 pts · marca registrada');
    if (v>=g.target && !g.done){ g.done = true; addPoints(200); save(); celebrate(g); }
  } else if (f.dataset.form==='nueva'){
    const d = draft, m = MONEY.includes(d.type), id = 'g'+Date.now();
    if (d.type==='fisica'){
      const r = RETOS[d.reto];
      S.goals.unshift({id, type:'fisica', reto:d.reto, name:r.n, cat:'Física', photos:[r.img], unit:r.unit, base:r.base, target:r.target, start:iso(today()), due:off(r.w*7), why:d.why.trim(),
        plan:Array.from({length:r.w},()=>r.plan.map(t=>({t, done:false}))), metrics:[{w:1, v:r.base}], hist:[]});
    } else {
      if (!d.name.trim()){ toast('Ponle nombre a tu meta'); return; }
      if (m && !(+d.price>0)){ toast('Escribe el precio que encontraste'); return; }
      const photo = d.photo || 'living';
      if (m && d.group){
        const n = Math.max(2, Math.min(20, +d.people||2));
        S.groups.unshift({id, name:d.name.trim(), photo, price:+d.price, start:iso(today()), due:d.due, code:'UGO-'+Math.random().toString(36).slice(2,6).toUpperCase(),
          members:[{n:'Tú', paid:+d.saved||0, show:'monto'}, ...Array.from({length:n-1},(_,k)=>({n:`Invitado ${k+2}`, paid:0, show:'pct'}))]});
        draft = null; addPoints(20); save(); go('grupo-'+id); confetti(50); toast('Meta en grupo creada · +20 pts'); return;
      }
      const g = {id, type:d.type, name:d.name.trim(), cat:TLABEL[d.type], photos:[photo], start:iso(today()), due:d.due, why:d.why.trim(), hist:[]};
      if (d.type==='viaje'){ const tot = +d.price; g.parts = [['Vuelos',.3],['Hospedaje',.35],['Comida',.2],['Actividades',.15]].map(([n,f])=>({n, p:Math.round(tot*f), s:0})); g.parts[0].s = Math.min(g.parts[0].p, +d.saved||0); g.checks = [{t:'Comprar vuelos',d:off(60),done:false},{t:'Reservar hospedaje',d:off(90),done:false},{t:'Hacer la maleta',d:d.due,done:false}]; }
      else if (m){ g.price = +d.price; g.saved = +d.saved||0; }
      else { g.total = Math.max(1, +d.total||1); g.count = 0; }
      S.goals.unshift(g);
    }
    draft = null; addPoints(20); save(); go('meta-'+id); confetti(50); toast('Meta creada · +20 pts');
  } else if (f.dataset.form==='join'){
    const v = document.getElementById('joincode').value.trim();
    toast(v ? `En la app real te unirías al grupo ${v.toUpperCase()}` : 'Escribe el código que te compartieron');
  }
});
let credLoaded = null;
function loadCredits(){
  const put = c => { const el = document.getElementById('credits'); if (!el) return; el.innerHTML = Object.entries(c).map(([k,v])=>`<li><a href="${esc(v.page)}" target="_blank" rel="noopener">${esc(v.title||k)}</a> · ${esc(v.source)} · ${esc(v.license)}</li>`).join(''); };
  if (credLoaded) return put(credLoaded);
  fetch('fotos-pro/creditos.json').then(r=>r.json()).then(c=>{ credLoaded = c; put(c); }).catch(()=>{ const el = document.getElementById('credits'); if (el) el.innerHTML = '<li>No se pudieron cargar los créditos.</li>'; });
}
addEventListener('resize', ()=>{ if (raf){ cv.width = innerWidth*devicePixelRatio; cv.height = innerHeight*devicePixelRatio; } });

applyMode();
render();
})();
</script>
